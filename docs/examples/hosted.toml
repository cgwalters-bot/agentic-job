# Generic GitHub-hosted ubuntu-26.04 configuration for docs/try-it.md.
# The workflow supplies the agent and limits. No deployment-specific
# repository packages, patch exceptions, inference addresses or identities.
[host]
stop-services = [
    "docker.socket", "docker.service", "containerd.service",
    "ssh.socket", "ssh.service", "sshd-unix-local.socket",
    "snapd.socket", "snapd.service", "multipathd.socket", "multipathd.service",
    "uuidd.socket", "uuidd.service", "iscsid.socket", "iscsid.service",
    "acpid.socket", "acpid.service",
]
close-resolved = true

[host.check]
allow-sockets = ["/run/systemd/netif/", "/run/systemd/resolve.hook/"]

[setup]
packages = ["nftables", "podman", "uidmap"]
