name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features legacy-runtime
      - run: python3 -B -m unittest discover -s egress -v
      - run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror bpf/world_write_policy_test.c -o "$RUNNER_TEMP/world-write-test"
          "$RUNNER_TEMP/world-write-test"
          bash bpf/build.sh "$RUNNER_TEMP/world_write.bpf.o"
