# GitHub's generated release notes use labels, not title prefixes.
# Exclude dependency-only noise by label, not by who authored the PR.
changelog:
  exclude:
    labels:
      - dependencies
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: CI
      labels:
        - github_actions
    - title: Other changes
      labels:
        - '*'
