# Inactive pending maintainer-approved ingress admission; see docs/job-container.md.
name: Job container

on:
  pull_request:
    paths: ['job-container/**', '.github/workflows/job-container.yml', '.github/actions/job-container-*/**']
  push:
    branches: [main]
    paths: ['job-container/**', '.github/workflows/job-container.yml', '.github/actions/job-container-*/**']

permissions:
  contents: read

concurrency:
  group: job-container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.archive.outputs.artifact-id }}
      artifact-digest: ${{ steps.archive.outputs.artifact-digest }}
      archive-sha256: ${{ steps.image.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Negative privilege-audit tests
        run: python3 -B -m unittest discover -s job-container -p 'test_*.py' -v
      - name: Build and audit without publication credentials
        id: image
        run: |
          podman build --tag localhost/job-container:build job-container
          podman run --rm --user 0 --entrypoint python3 --volume "$PWD/job-container:/tests:ro" localhost/job-container:build /tests/image_audit_test.py
          podman save --format oci-archive --output "$RUNNER_TEMP/job-container.tar" localhost/job-container:build
          echo "sha256=$(sha256sum "$RUNNER_TEMP/job-container.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-container.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # No PR event can reach a write-capable job. These jobs do not check out or
  # execute the image: candidate code only runs in the read-only probe job.
  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Validate same-run reviewed-main artifact metadata before transfer
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --argjson attempt "$GITHUB_RUN_ATTEMPT" '.event == "push" and .head_branch == "main" and .head_sha == $sha and .repository.full_name == $repo and .run_attempt == $attempt and .path == ".github/workflows/job-container.yml"' "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          jq -e --arg name "job-container-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg digest "sha256:$ARTIFACT_DIGEST" --argjson id "$ARTIFACT_ID" --argjson run "$GITHUB_RUN_ID" --argjson repo "$REPOSITORY_ID" '.id == $id and .name == $name and .expired == false and .size_in_bytes > 0 and .size_in_bytes <= 2147483648 and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $sha and .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo' "$RUNNER_TEMP/artifact.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/image
          merge-multiple: true
      - name: Publish commit-addressed candidate, never run it
        id: push
        env:
          TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/image/job-container.tar" | sha256sum --check --strict
          image="ghcr.io/${GITHUB_REPOSITORY,,}/job-container:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::https::Timeout=10 install -y --no-install-recommends skopeo
          printf '%s' "$TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          skopeo copy --digestfile "$RUNNER_TEMP/digest" "oci-archive:$RUNNER_TEMP/image/job-container.tar" "docker://$image"
          echo "image=${image%:*}@$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

  probe:
    needs: candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.candidate.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined --device /dev/fuse
    steps:
      - name: Shell identity before checkout
        run: python3 -c 'import os, shutil; assert os.getuid() == os.getgid() == 1001 and shutil.which("sudo") is None; print("PASS shell identity before checkout")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/job-container-js-probe
      - uses: ./.github/actions/job-container-composite-probe
      - name: Prove runtime properties
        run: python3 -B job-container/probe.py
      - name: Record the tested digest
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}
        run: |
          echo "PASS tested job-container digest: $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [candidate, probe]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Promote only the successfully probed digest
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}
          TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | podman login ghcr.io --username "$REGISTRY_USER" --password-stdin
          podman pull "$IMAGE"
          podman push "$IMAGE" "docker://${IMAGE%@*}:latest"
